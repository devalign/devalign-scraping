name: Daily Scraper (Parallel Matrix)

on:
  schedule:
    # Ejecutar todos los domingos a las 05:00 UTC
    - cron: '0 5 * * 0'
  workflow_dispatch:
    # Permite ejecución manual desde la interfaz de GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [computrabajo, getonboard, remotive, arbeitnow, weworkremotely]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Solo necesario para computrabajo si decidimos agregarlo luego,
      # pero lo mantenemos por si agregamos tests con browser.
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper para ${{ matrix.site }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Incrementamos los jobs meta a 500 para aumentar el dataset
          python scripts/run_scraper.py --site ${{ matrix.site }} --jobs 500 --max-duplicates 20

  trigger_api:
    needs: scrape
    runs-on: ubuntu-latest
    if: always() # Ejecutar aunque algún scraper de la matrix falle (así se guardan los que funcionaron)
    steps:
      - name: Trigger devalign-api normalization
        run: |
          curl -H "Authorization: token ${{ secrets.GH_PAT }}" \
               -H "Accept: application/vnd.github.v3+json" \
               -X POST \
               -d '{"event_type": "scraping_finished"}' \
               https://api.github.com/repos/${{ github.repository_owner }}/devalign-api/dispatches

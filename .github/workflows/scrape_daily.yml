name: Scheduled Scraper (Parallel LATAM Matrix)

on:
  schedule:
    # Ejecutar todos los domingos a las 05:00 UTC
    - cron: '0 5 * * 0'
  workflow_dispatch:
    # Permite ejecución manual desde la interfaz de GitHub

jobs:
  scrape-computrabajo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country: [pe, co, mx, cl, ar]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Computrabajo scraper for ${{ matrix.country }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/scrape_latam_suite.py \
            --ct-only \
            --countries ${{ matrix.country }} \
            --keywords software devops qa datos desarrollador \
            --jobs-per-batch 100

  scrape-getonboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run GetOnBoard scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/scrape_latam_suite.py \
            --gob-only \
            --jobs-per-batch 150

  scrape-remote:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [remotive, weworkremotely]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Remote scraper for ${{ matrix.site }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/run_scraper.py --site ${{ matrix.site }} --jobs 100

  trigger_api:
    needs: [scrape-computrabajo, scrape-getonboard, scrape-remote]
    runs-on: ubuntu-latest
    if: always() # Ejecutar aunque algún scraper de la matrix falle (así se guardan los que funcionaron)
    steps:
      - name: Trigger devalign-api normalization
        run: |
          curl -H "Authorization: token ${{ secrets.GH_PAT }}" \
               -H "Accept: application/vnd.github.v3+json" \
               -X POST \
               -d '{"event_type": "scraping_finished"}' \
               https://api.github.com/repos/${{ github.repository_owner }}/devalign-api/dispatches
